name: Android Build

# Отдельная сборка под Android: проверяет, что нативная часть проекта
# собирается на ubuntu-раннере. Подпись не нужна — собираем debug-APK.
# Линт и тесты остаются в Mobile CI (.github/workflows/ci.yml),
# iOS — в iOS Build (.github/workflows/ios.yml).

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Полный список ABI проекта: armeabi-v7a,arm64-v8a,x86,x86_64.
  # В CI собираем две (устройства + эмулятор), чтобы уложиться в лимит
  # времени раннера. Нужны все четыре — поменяйте значение.
  ABIS: arm64-v8a,x86_64

jobs:
  build:
    name: Сборка debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Gradle 9.4.1 и AGP 9 на JDK 11 не работают — нужен JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Обязательно до Gradle: settings.gradle подключает
      # includeBuild("../node_modules/@react-native/gradle-plugin"),
      # без node_modules autolinking не соберётся.
      - name: Install JS dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Версии заданы жёстко в android/build.gradle:
      # buildToolsVersion 37.0.0, compileSdkVersion 37,
      # ndkVersion 27.1.12297006. NDK и CMake нужны из-за
      # newArchEnabled=true (codegen + C++).
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          for pkg in "platforms;android-37.0" "platforms;android-37" \
                     "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"; do
            sdkmanager --install "$pkg" || echo "::warning::пакет $pkg не установлен"
          done
          # В SDK Android 17 (API 37) лежит каталогом platforms/android-37.0,
          # а Gradle ищет платформу по хэшу android-37. Симлинк страхует
          # от расхождения имени пакета и хэша платформы.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ] \
             && [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" \
                  "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Show toolchain versions
        run: |
          java -version
          node --version
          sdkmanager --list_installed
          ls "$ANDROID_SDK_ROOT/platforms"

      # --init-script обходит несовместимость метаданных Kotlin
      # (Gradle 9.4.1 несёт Kotlin 2.3.0, а @react-native/gradle-plugin
      # скомпилирован Kotlin 2.1.20) — см. ANDROID_TROUBLESHOOTING.md §5.
      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew --init-script skip-metadata-check-init.gradle assembleDebug \
            -PreactNativeArchitectures="$ABIS" \
            --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Check build artifact
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          du -h "$APK"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump badging "$APK" \
            | grep -m1 '^package:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 7
