name: iOS Build

# Отдельная проверка iOS-проекта на macOS-раннере. Сборка под симулятор
# (~10-15 минут) временно отключена: её быстрее запустить вручную в Xcode
# или через xcodebuild. Что осталось: зависимости ставятся, Xcode-проект
# парсится и видит схему сборки. Линт и тесты — в Mobile CI
# (.github/workflows/ci.yml), Android — в Android Build (android.yml).

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверка iOS-проекта
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          node --version
          ruby --version
          xcrun simctl list runtimes

      # Дешёвая проверка вместо сборки: pbxproj валиден, проект читается
      # и видны схема/таргеты. Занимает секунды, а не минуты.
      - name: Check Xcode project
        run: |
          test -f ios/Podfile
          test -d ios/univer_mobile.xcodeproj
          plutil -lint ios/univer_mobile.xcodeproj/project.pbxproj
          xcodebuild -list -project ios/univer_mobile.xcodeproj

      # Сборка под симулятор временно отключена: на macOS-раннере она
      # занимает 10-15 минут, автора изменений это не устраивает —
      # собираем вручную. Чтобы вернуть, раскомментируйте три шага ниже
      # и верните job'у timeout-minutes: 60.
